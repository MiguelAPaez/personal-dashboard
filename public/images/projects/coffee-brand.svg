<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <g id="bean">
      <ellipse rx="38" ry="26"/>
      <path d="M-30 2 C-12 -12 12 14 30 -2" fill="none" stroke="#2b1a12" stroke-width="5" stroke-linecap="round"/>
    </g>
  </defs>
  <rect width="1600" height="900" fill="#2b1a12"/>

  <!-- top-down cup on its saucer -->
  <circle cx="1080" cy="450" r="350" fill="#6b3e26" opacity="0.45"/>
  <circle cx="1080" cy="450" r="300" fill="none" stroke="#6b3e26" stroke-width="6"/>
  <rect x="1300" y="410" width="190" height="80" rx="40" fill="#c89b6d"/>
  <circle cx="1080" cy="450" r="240" fill="#c89b6d"/>
  <circle cx="1080" cy="450" r="208" fill="#2b1a12"/>
  <circle cx="1080" cy="450" r="170" fill="#6b3e26"/>
  <circle cx="1080" cy="450" r="128" fill="none" stroke="#c89b6d" stroke-width="10" opacity="0.7"/>
  <circle cx="1080" cy="450" r="84" fill="none" stroke="#c89b6d" stroke-width="8" opacity="0.5"/>
  <circle cx="1080" cy="450" r="40" fill="#c89b6d" opacity="0.6"/>

  <!-- roasted beans -->
  <use href="#bean" fill="#6b3e26" transform="translate(150 140) rotate(-20)"/>
  <use href="#bean" fill="#6b3e26" transform="translate(300 230) rotate(35)"/>
  <use href="#bean" fill="#6b3e26" transform="translate(210 380) rotate(-60)"/>
  <use href="#bean" fill="#6b3e26" transform="translate(420 120) rotate(10)"/>
  <use href="#bean" fill="#6b3e26" transform="translate(120 600) rotate(70)"/>
  <use href="#bean" fill="#6b3e26" transform="translate(360 520) rotate(-15)"/>
  <use href="#bean" fill="#6b3e26" transform="translate(540 330) rotate(50)"/>
  <use href="#bean" fill="#6b3e26" transform="translate(280 760) rotate(-40)"/>
  <use href="#bean" fill="#6b3e26" transform="translate(560 690) rotate(20)"/>
  <use href="#bean" fill="#6b3e26" transform="translate(650 160) rotate(-75)"/>
  <use href="#bean" fill="#6b3e26" transform="translate(1480 140) rotate(25)"/>
  <use href="#bean" fill="#6b3e26" transform="translate(1500 780) rotate(-30)"/>
  <!-- green (unroasted) beans: the contrast note -->
  <use href="#bean" fill="#8a9a5b" transform="translate(470 420) rotate(-35)"/>
  <use href="#bean" fill="#8a9a5b" transform="translate(180 860) rotate(15)"/>
  <use href="#bean" fill="#8a9a5b" transform="translate(720 820) rotate(60)"/>
</svg>
